<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北京惠民补贴 · 资格查询</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">北京住房补贴试运行</p>
      <h1>北京惠民补贴查询</h1>
      <p class="sub">回答几个问题，快速查看您可能符合的补贴项目与金额。</p>
      <ol class="steps" aria-label="查询步骤">
        <li class="active">填写基础信息</li>
        <li>补充必要信息</li>
        <li>查看匹配结果</li>
      </ol>
    </header>

    <div id="error" class="error" hidden></div>

    <section class="panel">
      <form id="intake">
        <div id="fields"></div>
        <button type="submit">下一步</button>
      </form>
    </section>

    <p class="note">
      本工具仅提供政策匹配参考，最终以各主管部门审核结果为准。
    </p>
  </main>

  <script src="app.js"></script>
  <script>
    // The gating set. Everything else is asked only if a live program needs it.
    const GATING = ["hukou_type", "household_size", "household_monthly_income"];

    const saved = store.profile;
    document.getElementById("fields").innerHTML =
      GATING.map((name) => renderField(name, saved[name])).join("");

    document.getElementById("intake").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = event.target.querySelector("button");
      button.disabled = true;
      try {
        const profile = readForm(event.target);
        const confirmed = await post("/profile/confirm", profile);
        store.profile = profile;
        sessionStorage.setItem("confirm", JSON.stringify(confirmed));
        location.href = "confirm.html";
      } catch (err) {
        showError(String(err.message || err));
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
